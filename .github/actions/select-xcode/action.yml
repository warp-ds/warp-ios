name: Select Xcode 26.5 toolchain
description: Selects Xcode 26.5 using xcode-select, as ios-app does

runs:
  using: 'composite'
  steps:
    - name: Select Xcode 26.5
      shell: bash
      run: |
        set -euo pipefail

        XCODE_VERSION="26.5"

        for candidate in \
          "/Applications/Xcode.app" \
          "/Applications/Xcode_${XCODE_VERSION}.app" \
          "/Applications/Xcode-${XCODE_VERSION}.app"; do
          if [[ -d "$candidate/Contents/Developer" ]]; then
            XCODE_PATH="$candidate"
            break
          fi
        done

        if [[ -z "${XCODE_PATH:-}" ]]; then
          echo "::error::Xcode $XCODE_VERSION not found. Installed:"
          find /Applications -maxdepth 1 -name "Xcode*.app" 2>/dev/null || echo "None found"
          exit 1
        fi

        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        ACTUAL="$(xcodebuild -version | awk 'NR==1{print $2}')"
        if [[ "$ACTUAL" != "$XCODE_VERSION" ]]; then
          echo "::error::Expected Xcode $XCODE_VERSION, got $ACTUAL."
          exit 1
        fi
        xcodebuild -version
