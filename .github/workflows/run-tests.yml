# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Xcode - Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:

    # macos-15, not macos-26, and deliberately so. Warp declares iOS 18 as its minimum (see
    # PLATFORM_SUPPORT.md), so the floor has to be tested as well as the latest, and the two are
    # only both available here:
    #
    # - macos-26 ships iOS 26.2/26.4/26.5 runtimes and nothing older. An iOS 18 runtime cannot be
    #   added either: `xcodebuild -downloadPlatform iOS` reports iOS 18 is not available.
    # - macos-15 ships iOS 18.5/18.6 alongside iOS 26.x, so both legs run with no download.
    #
    # Building still needs an iOS 26 SDK, because the source references iOS 26 symbols such as
    # `.glassProminent` and `UIBarButtonItem.Style.prominent`. macos-15 defaults to Xcode 16.4,
    # which cannot compile those, so a 26.x toolchain is selected below.
    runs-on: macos-15

    # A full leg takes about 7 minutes, so this is an outer safety net rather than a budget. It
    # exists because on 2026-09-14 the iOS 26 leg wedged inside `xcodebuild test` and ran until
    # GitHub's own 6-hour ceiling killed it, billing six hours of macOS runner time for nothing.
    #
    # 30 rather than 25 so that the boot probe's own budgets are what stop a wedge. Three probe
    # attempts worst-case to ~25 minutes including setup and build, which 25 clipped - and a job
    # killed at the timeout reports `cancelled` with no diagnosis, which is exactly what the probe
    # exists to replace with a named failure and a thread sample.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - ios-major: "18"
            label: "minimum supported"
          - ios-major: "26"
            label: "latest"

    name: iOS ${{ matrix.ios-major }} (${{ matrix.label }})

    steps:
    - uses: actions/checkout@v4

    # Highest installed 26.x rather than a pinned point release, so an image update that swaps
    # 26.3 for 26.4 does not break the build. Both matrix legs get the same toolchain, so a
    # difference between them is attributable to the OS version rather than to the compiler.
    - name: Select an Xcode 26 toolchain
      run: |
        set -euo pipefail
        # `|| true` because a plain assignment inherits the substitution's exit status: with
        # `pipefail`, a glob that matches nothing makes `ls` fail, and `set -e` would kill the
        # script here rather than letting the diagnostic below run.
        XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
        if [ -z "$XCODE_APP" ]; then
          echo "::error::No Xcode 26.x found on this runner image."
          ls -d /Applications/Xcode*.app
          exit 1
        fi
        sudo xcode-select -s "$XCODE_APP"
        xcodebuild -version

    - name: Resolve an iOS ${{ matrix.ios-major }} simulator
      id: sim
      run: |
        set -euo pipefail

        # The device type and runtime come out alongside the UDID because the boot probe below may
        # have to throw this device away and create an equivalent one.
        SIM="$(xcrun simctl list devices available -j \
          | jq -c --arg v "${{ matrix.ios-major }}" \
            '[.devices | to_entries[]
              | select(.key | test("SimRuntime.iOS-" + $v + "-"))
              | .key as $runtime | .value[] | select(.isAvailable)
              | {udid, name, runtime: $runtime, deviceType: .deviceTypeIdentifier}] | first // empty')"

        # Deliberately no download fallback. Runtimes that are absent from the image are also
        # generally unavailable to `xcodebuild -downloadPlatform`, so failing here with the
        # runtime list is more useful than a multi-GB download that cannot succeed.
        if [ -z "$SIM" ]; then
          echo "::error::No iOS ${{ matrix.ios-major }} runtime on this image. Runtimes available:"
          xcrun simctl list runtimes
          exit 1
        fi

        UDID="$(jq -r '.udid' <<<"$SIM")"
        echo "Using simulator $UDID ($(jq -r '.name' <<<"$SIM"), $(jq -r '.runtime' <<<"$SIM"))"
        {
          echo "udid=$UDID"
          echo "device_type=$(jq -r '.deviceType' <<<"$SIM")"
          echo "runtime=$(jq -r '.runtime' <<<"$SIM")"
        } >> "$GITHUB_OUTPUT"

        # Fire-and-forget, so the boot overlaps with the build step rather than blocking it. The
        # probe step owns the device lifecycle and waits for boot *completion* itself, under its own
        # bound, so there is nothing to wait for here.
        xcrun simctl boot "$UDID" || true

    # A UDID rather than a device name: a bare `platform=iOS Simulator,name=...` destination can
    # misresolve to a tvOS or visionOS device, and a name alone does not pin the OS version.
    - name: Build for iOS
      run: xcodebuild -scheme warp-ios -destination "id=${{ steps.sim.outputs.udid }}" build

    # Checks that this simulator boot can build a SwiftUI environment at all, before the real suite
    # runs, and throws the device away if it cannot.
    #
    # This replaces an earlier unbounded "warm-up" step built on the theory that the first
    # `EnvironmentValues()` on a cold device has a large but finite cost (~19s locally). Run
    # 35710643887 tested that unbounded and disproved it: the call never returned in 20m40s on iOS
    # 26, while the identical call was 0.203s on an equally fresh iOS 26 device in run 35338773478
    # and 0.234s on the iOS 18 leg of the same job. Roughly 0.2s or never is a hang, not a cache
    # fill, so waiting it out cannot work - and waiting it out unbounded burns the entire job and
    # prints nothing after `Test Case ... started.`
    #
    # Sampling the hung test host identified the call: `EnvironmentValues()` reaches
    # `+[UIScreen initialize]`, which makes a synchronous, un-timed XPC round trip to the simulator's
    # BoardServices daemon for the application initialization context. If that daemon answers you pay
    # the round trip; if it does not, `xpc_connection_send_message_with_reply_sync` never returns. So
    # a wedge belongs to the *boot*, which is why the recovery here is a different device rather than
    # a longer wait. Full stack in SimulatorBootProbeTests.
    - name: Probe the simulator boot
      id: probe
      run: |
        # Deliberately no `-e`: every failure below is handled, and an unhandled exit here would
        # skip the diagnostics that are the whole point of the step.
        set -uo pipefail

        UDID="${{ steps.sim.outputs.udid }}"
        DEVICE_TYPE="${{ steps.sim.outputs.device_type }}"
        RUNTIME="${{ steps.sim.outputs.runtime }}"

        # Split budgets, because they bound different things. BOOT covers `simctl bootstatus`.
        # BUILD covers everything from there to the test entering the runtime - an incremental
        # WarpTests build plus install, measured at 40s (iOS 26) and 65s (iOS 18). PROBE covers only
        # the test body, measured at 0.203s and 0.234s on healthy runners.
        #
        # PROBE is 90s rather than something nearer the measurement because the same test takes
        # 5-20s on a developer Mac, varying run to run on one device with no warming trend, so the
        # healthy cost is clearly host-dependent and a budget tuned to the runner alone would be
        # brittle. It is still ~200x the observed CI cost and fails in 90s instead of 25 minutes.
        #
        # BUILD stays generous because a false trip there is expensive and pointless - it would
        # erase a perfectly good device and rebuild. Reaching the runtime has measured 40s, 54s, 65s
        # and 68s across both legs, so 240s is ~3.5x the worst seen. BOOT is tighter, because a
        # `bootstatus` that is going to return at all returns in seconds.
        #
        # Worst case is 3 x (90 + 240 + 90 + recycle), which lands around 27 minutes including setup
        # and the main build - inside `timeout-minutes: 30`, so the step always gets to report
        # rather than being cut off mid-sentence.
        BOOT_BUDGET=90
        BUILD_BUDGET=240
        PROBE_BUDGET=30
        MAX_ATTEMPTS=3

        DIAG_DIR="$RUNNER_TEMP/simulator-diagnostics"
        mkdir -p "$DIAG_DIR"

        # Waits for the boot to *complete*, not for the device state to read `Booted`.
        # CoreSimulator reports `Booted` as soon as `launchd_sim` is up, which is well before the
        # service set is running - and the service set is the whole problem here, because the first
        # SwiftUI environment synchronously asks BoardServices for the application initialization
        # context. A device that is `Booted` but not finished booting is exactly the state in which
        # that request has nobody to answer it.
        #
        # `bootstatus` is bounded rather than trusted. The comment it replaces recorded that it
        # "waits forever and hung a job here until the workflow timeout" - no run is cited, so treat
        # that as a report rather than a measurement, but it is worth respecting either way, and it
        # would be consistent with this same failure observed one layer earlier. A boot that will not
        # finish is a boot worth throwing away, and finding that out here costs 90s instead of a
        # build plus a probe cycle.
        ensure_booted() {
          DEV="$1"
          xcrun simctl boot "$DEV" >/dev/null 2>&1 || true

          BOOT_DONE="$RUNNER_TEMP/bootstatus-done"
          rm -f "$BOOT_DONE"
          ( xcrun simctl bootstatus "$DEV" -b > "$DIAG_DIR/bootstatus-$DEV.txt" 2>&1; echo $? > "$BOOT_DONE" ) &

          WAITED=0
          while [ ! -f "$BOOT_DONE" ] && [ "$WAITED" -lt "$BOOT_BUDGET" ]; do
            sleep 2
            WAITED=$((WAITED + 2))
          done

          if [ ! -f "$BOOT_DONE" ]; then
            echo "::warning::$DEV did not finish booting within ${BOOT_BUDGET}s - treating the boot as bad."
            pkill -f "simctl bootstatus" 2>/dev/null || true
            return 1
          fi
          if [ "$(cat "$BOOT_DONE")" -ne 0 ]; then
            echo "::warning::bootstatus reported failure for $DEV"
            return 1
          fi
          echo "Boot completed in ${WAITED}s."
          return 0
        }

        # `sample` is the only thing that answers "blocked on what" - it walks every thread of the
        # hung test host and needs no privileges for our own processes. This is what a future
        # diagnosis will be built from, so capture it before anything is killed.
        capture_diagnostics() {
          TAG="$1"
          echo "::group::Diagnostics for $TAG"
          for NAME in xctest testmanagerd; do
            for PID in $(pgrep -x "$NAME" 2>/dev/null || true); do
              echo "sampling $NAME ($PID) for 3s"
              /usr/bin/sample "$PID" 3 -file "$DIAG_DIR/$TAG-$NAME-$PID.txt" >/dev/null 2>&1 || true
            done
          done
          ps -Ao pid,ppid,stat,etime,command \
            | grep -E 'xctest|xcodebuild|testmanagerd|CoreSimulator|launchd_sim' \
            | grep -v grep > "$DIAG_DIR/$TAG-ps.txt" 2>&1 || true
          xcrun simctl list devices > "$DIAG_DIR/$TAG-devices.txt" 2>&1 || true
          echo "captured: $(ls "$DIAG_DIR" | tr '\n' ' ')"
          echo "::endgroup::"
        }

        # Two different recoveries on purpose, so the logs say which one is sufficient. If erasing is
        # always enough the bad state belongs to the device; if only a new device works it is deeper.
        # Sets UDID for the next attempt.
        recycle_device() {
          if [ "$ATTEMPT" -eq 1 ]; then
            echo "Recovery: shutdown and erase $UDID"
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl erase "$UDID" >/dev/null 2>&1 || true
          else
            echo "Recovery: create a replacement device"
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            NEW_UDID="$(xcrun simctl create "warp-ci-probe-$ATTEMPT" "$DEVICE_TYPE" "$RUNTIME")"
            if [ -n "$NEW_UDID" ]; then
              UDID="$NEW_UDID"
              echo "Replacement device $UDID"
            else
              echo "::warning::Could not create a replacement device; retrying on $UDID"
            fi
          fi
        }

        ATTEMPT=0
        while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
          ATTEMPT=$((ATTEMPT + 1))

          # A boot that never completes cannot answer the XPC request the probe is about to make, so
          # there is nothing to learn from building and running against it. Recycle immediately.
          if ! ensure_booted "$UDID"; then
            capture_diagnostics "attempt-$ATTEMPT-boot"
            [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ] && break
            recycle_device
            continue
          fi

          LOG="$DIAG_DIR/attempt-$ATTEMPT-xcodebuild.log"
          DONE="$RUNNER_TEMP/probe-done-$ATTEMPT"
          rm -f "$DONE"

          echo "::group::Probe attempt $ATTEMPT on $UDID"
          # SCRATCH BRANCH ONLY - DO NOT MERGE. Forces attempts 1 and 2 to wedge so that the
          # recovery path runs for real. `TEST_RUNNER_`-prefixed variables are forwarded by
          # xcodebuild into the test process with the prefix stripped.
          FORCE_ENV=""
          [ "$ATTEMPT" -lt 3 ] && FORCE_ENV="TEST_RUNNER_WARP_PROBE_FORCE_HANG=1"
          [ -n "$FORCE_ENV" ] && echo "DRILL: forcing this attempt to wedge"

          # The sentinel file rather than `kill -0` on the child: a finished-but-unreaped child is
          # still signalable, so liveness checks cannot tell "done" from "running".
          (
            env $FORCE_ENV xcodebuild -scheme WarpTests -destination "id=$UDID" \
              -only-testing:WarpTests/SimulatorBootProbeTests \
              -test-timeouts-enabled NO \
              test > "$LOG" 2>&1
            echo $? > "$DONE"
          ) &

          ELAPSED=0
          STARTED=0
          DEADLINE="$BUILD_BUDGET"
          while [ ! -f "$DONE" ] && [ "$ELAPSED" -lt "$DEADLINE" ]; do
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            if [ "$STARTED" -eq 0 ] \
              && grep -qF "SimulatorBootProbeTests testFirstSwiftUIEnvironmentResolves]' started" "$LOG" 2>/dev/null; then
              STARTED=1
              DEADLINE=$((ELAPSED + PROBE_BUDGET))
              echo "Test entered the runtime after ${ELAPSED}s; allowing ${PROBE_BUDGET}s to return."
            fi
          done

          if [ -f "$DONE" ]; then
            STATUS="$(cat "$DONE")"
            tail -30 "$LOG"
            echo "::endgroup::"
            if [ "$STATUS" -eq 0 ]; then
              echo "Boot probe passed on attempt $ATTEMPT in ${ELAPSED}s. Device $UDID is healthy."
              echo "udid=$UDID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A clean non-zero exit is a compile or assertion failure. Retrying it on a fresh
            # device would turn a real, reproducible failure into flake.
            echo "::error::Boot probe exited $STATUS. That is a build or test failure, not a wedge."
            cat "$LOG"
            exit "$STATUS"
          fi

          if [ "$STARTED" -eq 1 ]; then
            echo "::warning::Probe test did not return within ${PROBE_BUDGET}s - this boot is wedged."
          else
            echo "::warning::Probe did not reach the runtime within ${BUILD_BUDGET}s - build or install is wedged."
          fi
          capture_diagnostics "attempt-$ATTEMPT"
          tail -30 "$LOG" 2>/dev/null
          echo "::endgroup::"

          pkill -x xctest 2>/dev/null || true
          pkill -f 'xcodebuild -scheme WarpTests' 2>/dev/null || true
          sleep 3

          [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ] && break
          recycle_device
        done

        echo "::error::The simulator boot probe wedged on all $MAX_ATTEMPTS attempts. Thread samples of the hung process are in the simulator-diagnostics artifact."
        exit 1

    # Always, because the samples are only interesting when the step above failed.
    - name: Upload simulator diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: simulator-diagnostics-ios-${{ matrix.ios-major }}
        path: ${{ runner.temp }}/simulator-diagnostics
        if-no-files-found: ignore
        retention-days: 14

    # Inner half of the pair with `timeout-minutes` above. The job timeout bounds the bill; these
    # bound the diagnosis, because a test that overruns fails by name where a job timeout just
    # stops the machine mid-sentence.
    #
    # The flags below only reach XCTest: they drive `XCTestCase.executionTimeAllowance`, and
    # swift-testing ignores them. The suites that wait on a timer are swift-testing and carry their
    # own `.timeLimit` trait instead - see ToastTests and SnackbarTests.
    #
    # 120s. The whole XCTest half runs in well under a second, so this is not a bound on healthy
    # work - it is how fast a wedge that slips past the probe gets a name attached to it. The
    # earlier reasoning for raising this to 600s was that an allowance below the cold-start cost
    # multiplies the failure; that rested on a cold-start cost which run 35710643887 showed does not
    # exist, so the argument for a long allowance goes with it.
    #
    # The device comes from the probe step, not from `sim`: the probe may have replaced it.
    - name: Run tests
      run: |
        xcodebuild -scheme WarpTests -destination "id=${{ steps.probe.outputs.udid }}" \
          -test-timeouts-enabled YES \
          -default-test-execution-time-allowance 120 \
          test
